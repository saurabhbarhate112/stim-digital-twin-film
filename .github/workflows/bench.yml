name: bench
on: workflow_dispatch
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz'; free -g | head -2
      - run: pip install -q pillow && python tools/pcb_maps.py
      - run: |
          curl -sSL https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz | tar -xJ -C /tmp
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libgl1 libsm6 libegl1 >/dev/null
      - run: /tmp/blender-4.5.9-linux-x64/blender -b --factory-startup -P blender/lookdev.py -- /tmp/bench 6 | grep -E 'RENDER |Error|Sample (1|6)/6'
